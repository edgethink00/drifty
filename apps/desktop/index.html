<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/drifty-icon.png" />
    <title>Drifty</title>
    <script>
      (() => {
        window.__DTIME_RESOLVE_BOOT_SURFACE__ = () => {
          const datasetSurface = document.documentElement.dataset.surface;
          if (datasetSurface === "watcher" || datasetSurface === "drift-alarm") return datasetSurface;

          try {
            const querySurface = new URLSearchParams(window.location.search).get("driftySurface");
            if (querySurface === "watcher" || querySurface === "drift-alarm") return querySurface;
          } catch (_error) {}

          return "app";
        };

        const surface = window.__DTIME_RESOLVE_BOOT_SURFACE__();
        if (surface === "watcher" || surface === "drift-alarm") document.documentElement.dataset.surface = surface;
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #091221;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html[data-surface="watcher"],
      html[data-surface="watcher"] body,
      html[data-surface="drift-alarm"],
      html[data-surface="drift-alarm"] body {
        background: transparent;
      }
      html[data-surface="watcher"] {
        --drifty-boot-debug-edge: 0.75rem;
        --drifty-boot-debug-width: 20rem;
        --drifty-boot-debug-max-height: 7.5rem;
      }
      html[data-surface="drift-alarm"] {
        --drifty-boot-debug-edge: 1rem;
        --drifty-boot-debug-width: 22rem;
        --drifty-boot-debug-max-height: 8.75rem;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: none;
      }
      .boot-loading {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: rgba(248, 250, 252, 0.6);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 0.9; }
      }
      .boot-error {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 2147483647;
        width: min(720px, calc(100vw - 32px));
        max-height: min(70vh, 520px);
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 10px;
        padding: 14px 16px;
        background: rgba(127, 29, 29, 0.94);
        border: 1px solid rgba(254, 202, 202, 0.82);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(69, 10, 10, 0.72) inset;
        color: #fff7ed;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        display: none;
      }
      html[data-surface="watcher"] .boot-error,
      html[data-surface="drift-alarm"] .boot-error {
        left: var(--drifty-boot-debug-edge);
        right: auto;
        top: auto;
        bottom: var(--drifty-boot-debug-edge);
        transform: none;
        box-sizing: border-box;
        width: min(var(--drifty-boot-debug-width), calc(100vw - (var(--drifty-boot-debug-edge) * 2)));
        max-height: min(var(--drifty-boot-debug-max-height), calc(100vh - (var(--drifty-boot-debug-edge) * 2)));
        overflow: auto;
        padding: 0.625rem 0.75rem;
        font-size: 0.6875rem;
        line-height: 1.4;
        z-index: 2147483647;
      }
    </style>
    <script>
      window.__DTIME_BOOT_ERROR__ = null;
      window.addEventListener("error", (event) => {
        const el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(event.message || event.error || "Unknown startup error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        const surface = window.__DTIME_RESOLVE_BOOT_SURFACE__?.() ?? "app";
        if (window.__DTIME_BOOTSTRAPPED__ && (surface === "watcher" || surface === "drift-alarm")) {
          event.preventDefault();
          document.getElementById("boot-error")?.remove();
          return;
        }

        const el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(event.reason?.message || event.reason || "Unknown promise rejection");
      });
      window.setTimeout(() => {
        const status = document.getElementById("boot-status");
        if (!status || window.__DTIME_BOOTSTRAPPED__) return;
        status.textContent = "drifty still loading\u2026";
      }, 2500);
    </script>
  </head>
  <body>
    <div id="boot-shell" aria-busy="true" aria-label="Loading Drifty">
      <span id="boot-status" class="boot-loading">drifty loading&hellip;</span>
    </div>
    <div id="boot-error" class="boot-error"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
