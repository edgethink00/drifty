<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/drifty-icon.png" />
    <title>Drifty</title>
    <script>
      (() => {
        const defaultTheme = "dark";

        window.__DRIFTY_RESOLVE_BOOT_THEME__ = () => {
          try {
            const savedTheme = window.localStorage.getItem("drifty.theme");
            if (savedTheme === "light" || savedTheme === "dark") return savedTheme;
          } catch (_error) {}

          return defaultTheme;
        };

        window.__DRIFTY_RESOLVE_BOOT_SURFACE__ = () => {
          const datasetSurface = document.documentElement.dataset.surface;
          if (datasetSurface === "watcher" || datasetSurface === "companion" || datasetSurface === "drift-alarm" || datasetSurface === "pet-mode") return datasetSurface;

          try {
            const querySurface = new URLSearchParams(window.location.search).get("driftySurface");
            if (querySurface === "watcher" || querySurface === "companion" || querySurface === "drift-alarm" || querySurface === "pet-mode") return querySurface;
          } catch (_error) {}

          return "app";
        };

        const surface = window.__DRIFTY_RESOLVE_BOOT_SURFACE__();
        const theme = window.__DRIFTY_RESOLVE_BOOT_THEME__();
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        if (surface === "watcher" || surface === "companion" || surface === "drift-alarm" || surface === "pet-mode") {
          document.documentElement.dataset.surface = surface;
        } else {
          document.documentElement.dataset.bootActive = "true";
        }
      })();
    </script>
    <style>
      :root {
        --boot-canvas: #0f0f0d;
        --boot-scrim: rgba(15, 15, 13, 0.6);
        --boot-text: #e8e6df;
        --boot-text-soft: #8a8780;
        --boot-mark-filter: invert(1);
        --boot-warn: #c85a4e;
        --boot-warn-line: rgba(200, 90, 78, 0.3);
      }
      :root[data-theme="light"] {
        --boot-canvas: #f2f1ed;
        --boot-scrim: rgba(242, 241, 237, 0.6);
        --boot-text: #1c1c19;
        --boot-text-soft: #79776f;
        --boot-mark-filter: none;
        --boot-warn: #9e4238;
        --boot-warn-line: rgba(158, 66, 56, 0.3);
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: transparent;
        color: var(--boot-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html[data-surface="watcher"],
      html[data-surface="watcher"] body,
      html[data-surface="companion"],
      html[data-surface="companion"] body,
      html[data-surface="drift-alarm"],
      html[data-surface="drift-alarm"] body,
      html[data-surface="pet-mode"],
      html[data-surface="pet-mode"] body {
        background: transparent;
      }
      html[data-surface="watcher"] {
        --drifty-boot-debug-edge: 0.75rem;
        --drifty-boot-debug-width: 20rem;
        --drifty-boot-debug-max-height: 7.5rem;
      }
      html[data-surface="companion"] {
        --drifty-boot-debug-edge: 0.25rem;
        --drifty-boot-debug-width: 18rem;
        --drifty-boot-debug-max-height: 6rem;
      }
      html[data-surface="drift-alarm"] {
        --drifty-boot-debug-edge: 1rem;
        --drifty-boot-debug-width: 22rem;
        --drifty-boot-debug-max-height: 8.75rem;
      }
      html[data-surface="pet-mode"] {
        --drifty-boot-debug-edge: 0.5rem;
        --drifty-boot-debug-width: 12rem;
        --drifty-boot-debug-max-height: 6rem;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--boot-scrim);
        backdrop-filter: blur(50px) saturate(0.88);
        -webkit-backdrop-filter: blur(50px) saturate(0.88);
        pointer-events: none;
        z-index: 2147483646;
      }
      html[data-boot-active="true"] #root {
        visibility: hidden;
      }
      #boot-shell[hidden] {
        display: none;
      }
      .boot-window-drag-strip {
        position: fixed;
        top: 0;
        left: 96px;
        right: 0;
        height: 32px;
        pointer-events: auto;
      }
      html[data-surface="watcher"] #boot-shell,
      html[data-surface="companion"] #boot-shell,
      html[data-surface="pet-mode"] #boot-shell,
      html[data-surface="drift-alarm"] #boot-shell {
        display: none;
      }
      .boot-loading__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 11.4px;
        animation: boot-breathe 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-loading__mark {
        width: 51.681px;
        height: 51.681px;
        display: block;
        filter: var(--boot-mark-filter);
        opacity: 0.72;
      }
      .boot-loading {
        color: color-mix(in srgb, var(--boot-text) 72%, transparent);
        font-size: 17.325px;
        font-weight: 500;
        letter-spacing: 0.01em;
        line-height: 1.4;
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 0.62; }
        50%      { opacity: 0.82; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading__content {
          animation: none;
          opacity: 0.72;
        }
      }
      .boot-error {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 2147483647;
        width: min(720px, calc(100vw - 32px));
        max-height: min(70vh, 520px);
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-radius: 10px;
        padding: 14px 16px;
        background: color-mix(in srgb, var(--boot-warn) 82%, black);
        border: 1px solid color-mix(in srgb, var(--boot-warn-line) 72%, var(--boot-warn));
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42), 0 0 0 1px color-mix(in srgb, var(--boot-warn) 40%, black) inset;
        color: #fff7ed;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        display: none;
      }
      html[data-surface="watcher"] .boot-error,
      html[data-surface="companion"] .boot-error,
      html[data-surface="pet-mode"] .boot-error,
      html[data-surface="drift-alarm"] .boot-error {
        left: var(--drifty-boot-debug-edge);
        right: auto;
        top: auto;
        bottom: var(--drifty-boot-debug-edge);
        transform: none;
        box-sizing: border-box;
        width: min(var(--drifty-boot-debug-width), calc(100vw - (var(--drifty-boot-debug-edge) * 2)));
        max-height: min(var(--drifty-boot-debug-max-height), calc(100vh - (var(--drifty-boot-debug-edge) * 2)));
        overflow: auto;
        padding: 0.625rem 0.75rem;
        font-size: 0.6875rem;
        line-height: 1.4;
        z-index: 2147483647;
      }
    </style>
    <script>
      window.__DRIFTY_BOOT_ERROR__ = null;
      window.addEventListener("error", (event) => {
        const el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(event.message || event.error || "Unknown startup error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        const surface = window.__DRIFTY_RESOLVE_BOOT_SURFACE__?.() ?? "app";
        if (window.__DRIFTY_BOOTSTRAPPED__ && (surface === "watcher" || surface === "companion" || surface === "drift-alarm" || surface === "pet-mode")) {
          event.preventDefault();
          document.getElementById("boot-error")?.remove();
          return;
        }

        const el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(event.reason?.message || event.reason || "Unknown promise rejection");
      });
    </script>
  </head>
  <body>
    <div id="boot-shell" aria-busy="true" aria-label="Loading Drifty">
      <div class="boot-window-drag-strip" data-tauri-drag-region aria-hidden="true"></div>
      <div class="boot-loading__content">
        <img class="boot-loading__mark" src="/src/assets/drifty-mark.svg" alt="" aria-hidden="true" />
        <span id="boot-status" class="boot-loading" role="status" aria-live="polite">drifty loading&hellip;</span>
      </div>
    </div>
    <div id="boot-error" class="boot-error"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
