<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/drifty-icon.png" />
    <title>Drifty</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #091221;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        pointer-events: none;
      }
      .boot-loading {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: rgba(248, 250, 252, 0.6);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 0.9; }
      }
      .boot-error {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: 480px;
        white-space: pre-wrap;
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(239, 68, 68, 0.14);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #fecaca;
        font-size: 13px;
        display: none;
      }
    </style>
    <script>
      window.__DTIME_BOOT_ERROR__ = null;
      window.addEventListener("error", function (event) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String(event.message || event.error || "Unknown startup error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        var el = document.getElementById("boot-error");
        if (!el) return;
        el.style.display = "block";
        el.textContent = String((event.reason && event.reason.message) || event.reason || "Unknown promise rejection");
      });
      window.setTimeout(function () {
        var status = document.getElementById("boot-status");
        if (!status || window.__DTIME_BOOTSTRAPPED__) return;
        status.textContent = "drifty still loading\u2026";
      }, 2500);
    </script>
  </head>
  <body>
    <div id="boot-shell" aria-busy="true" aria-label="Loading Drifty">
      <span id="boot-status" class="boot-loading">drifty loading&hellip;</span>
    </div>
    <div id="boot-error" class="boot-error"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
