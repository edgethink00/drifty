name: Bug report
description: Something in Drifty does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Please blur anything personal in screenshots.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Drifty version
      placeholder: "Settings › About, for example 1.21.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.4 or Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Official download
        - Built from source
    validations:
      required: true
