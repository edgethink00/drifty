name: CI

# Public CI runs only on GitHub-hosted runners. Pull requests from forks get a
# read-only token and no secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint and web tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Several web tests group activity by local day and expect a non-UTC zone.
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web

  python:
    name: Tracker tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python3 --version
      - run: npm run test:python

  rust:
    name: Rust tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # tauri::generate_context!() needs the frontend dist folder and the
      # sidecar binaries at compile time; cargo test never runs them.
      - name: Stub frontend dist and sidecars
        run: |
          mkdir -p apps/desktop/dist src-tauri/binaries
          printf '<!doctype html><title>ci-stub</title>\n' > apps/desktop/dist/index.html
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            for name in drifty-tracker chatgpt-session-ax; do
              printf '#!/bin/sh\nexit 0\n' > "src-tauri/binaries/$name-$triple"
              chmod +x "src-tauri/binaries/$name-$triple"
            done
          done
      - name: Rust tests
        env:
          RUST_TEST_THREADS: "1"
        run: npm run test:rust
