[package]
name = "drifty-screen-context-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local screen evidence lifecycle, storage, and bounded scheduling"
rust-version = "1.89"

[features]
native-key-store = ["dep:keyring"]

[dependencies]
png = "0.18.1"
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
close_fds = "0.3.2"
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security_Credentials", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "screen-context-protocol-fixture"
path = "tests/fixtures/native_helper.rs"

[[example]]
name = "memory_capture"
required-features = ["native-key-store"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
