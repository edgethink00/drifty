[package]
name = "drifty"
version = "1.1.11"
description = "Tauri 2 time-tracking shell for Drifty"
authors = ["EdgeThink"]
edition = "2021"

[lib]
name = "drifty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSImageView", "NSBitmapImageRep", "NSPanel", "NSResponder", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSData", "NSDictionary", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
smappservice-rs = "0.1.3"

[dev-dependencies]
tempfile = "3"
