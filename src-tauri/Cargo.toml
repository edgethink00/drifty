[package]
name = "drifty"
version = "1.11.22"
description = "Tauri 2 time-tracking shell for Drifty"
authors = ["EdgeThink"]
edition = "2021"
default-run = "drifty"

[lib]
name = "drifty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1.2"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sentry = { version = "0.48.4", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
# `macos-private-api` must stay here: tauri-build validates this feature list
# against `macOSPrivateApi` in tauri.conf.json, and a target-gated dependency
# entry is invisible to that check. Windows builds carry the unused feature.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }
thiserror = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-snap-layout = "=1.0.9"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSAlert", "NSAnimationContext", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSImageView", "NSBitmapImageRep", "NSPanel", "NSResponder", "NSSavePanel", "NSScreen", "NSTextField", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "NSRunningApplication", "block2", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAMediaTimingFunction", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGEventSource", "CGEventTypes"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSData", "NSDictionary", "NSProcessInfo", "std"] }
security-framework = "3.7"
security-framework-sys = "2.15"
smappservice-rs = "0.1.3"
# Tauri's clearEffects() is a silent no-op on macOS (its vibrancy module only
# clears on Windows), so the Dev A/B blur toggle drives window-vibrancy
# directly. Same crate/version Tauri itself embeds; adds no new build weight.
window-vibrancy = "0.6"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1" }

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
uiautomation = "0.25.1"
winreg = "0.56.0"
windows-version = "0.1.7"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
muda = { version = "0.19", default-features = false }

[[test]]
name = "native_menu_lifetime"
harness = false

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO", "Win32_System_Ioctl"] }

[profile.release]
debug = 1
split-debuginfo = "packed"
